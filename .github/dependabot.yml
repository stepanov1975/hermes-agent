version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:05"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:25"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:45"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      npm-root:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/scripts/whatsapp-bridge"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:05"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      whatsapp-bridge:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/ui-tui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:25"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      ui-tui:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/ui-tui/packages/hermes-ink"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      hermes-ink:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:05"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      web:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:25"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      website:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
